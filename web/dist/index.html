    <!--
      Theme must be resolved BEFORE first paint. Resolving it in a React effect
      (as the prototype did) shows a flash of the light theme to dark-mode users.
      Kept inline and blocking on purpose — it is a few hundred bytes.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("kcc.theme");
          var dark =
            stored === "dark" ||
            (stored === null && window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
        } catch (_) {
          /* private mode / storage disabled — fall through to the light default */
        }
      })();
    </script>
